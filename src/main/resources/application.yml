server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: brim-game-platform

  # Database - H2 for dev, PostgreSQL for prod
  datasource:
    url: jdbc:h2:mem:game_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis for session/room management
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        linger.ms: 10
        batch.size: 32768
        max.block.ms: 1000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        spring.json.trusted.packages: "com.brim.game.model.dto"
    listener:
      ack-mode: record
    consumer:
      enable-auto-commit: false
      group-id: game-platform
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.brim.game.model.dto.GameMessage

  # WebSocket
  websocket:
    path: /ws/game

# Game Configuration
game:
  snake:
    grid-width: 6000
    grid-height: 3600
    initial-length: 3
    tick-rate-ms: 50
  tank:
    map-width: 3600
    map-height: 2400
    tank-speed: 5
    bullet-speed: 15
    tick-rate-ms: 50
  runtime:
    workers: 2
    max-rooms: 64
  bot:
    workers: 1
  kafka:
    route-moves: false
  room:
    max-rooms: 128
    max-players: 16
    timeout-seconds: 300

# Logging
logging:
  level:
    com.brim.game: DEBUG
    org.springframework.kafka: INFO
    org.springframework.web.socket: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
